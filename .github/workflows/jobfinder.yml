# Main workflow: company sites (twice a day), job boards and recruiters (every few days).
# Schedules live in YOUR private config; the cron lines below only wake the workflow up.
# The run is idempotent: whatever wakes it (this cron, cron-job.org, a manual run)
# a group runs at most once per slot. See docs/SETUP.es.md.
name: jobfinder

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Europe/Madrid"
    - cron: "30 20 * * *"
      timezone: "Europe/Madrid"
    - cron: "0 11 * * *"
      timezone: "Europe/Madrid"
    - cron: "0 18 * * 0"
      timezone: "Europe/Madrid"
    # Safety tick: catches slots GitHub skipped or delayed (runs only what is due, ~15 s when nothing is).
    # Hourly because GitHub drops many scheduled runs (about half of the 2-hourly ticks on a normal day);
    # a missed slot still runs up to `grace_hours` (default 12) late.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | test-notify | test-ai | test-source | bootstrap | validate | tracker-sync"
        type: choice
        options: [run, dry-run, test-notify, test-ai, test-source, bootstrap, validate, tracker-sync]
        default: run
      groups:
        description: "Only these groups (comma separated, optional)"
        type: string
        default: ""
      force:
        description: "Run the groups even if they are not due"
        type: boolean
        default: false
      source:
        description: "test-source: source number as shown in the logs, e.g. 7 (a name would appear in the public log)"
        type: string
        default: ""

permissions:
  contents: read

# tracker-sync (cron-job.org, every 1–3 h) has its own queue: GitHub cancels the *pending* run of a
# concurrency group when another one is queued, and a sync must never replace a real run.
concurrency:
  group: jobfinder-${{ inputs.mode == 'tracker-sync' && 'tracker' || 'main' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check setup
        if: vars.DATA_REPO == ''
        run: |
          echo "::error::Set the repository variable DATA_REPO (owner/private-repo) and the secret DATA_REPO_TOKEN. See docs/SETUP.es.md"
          exit 1

      - uses: actions/checkout@v5

      - name: Checkout private data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --no-dev --extra apprise

      - name: Browser needed?
        id: browser
        if: inputs.mode != 'tracker-sync'
        run: uv run --no-sync jobfinder needs-browser --data-dir data

      - name: Install headless browser
        if: steps.browser.outputs.browser == 'true'
        run: |
          uv sync --frozen --no-dev --extra apprise --extra browser
          uv run --no-sync playwright install --with-deps chromium

      - name: Run
        env:
          # Secrets are listed one by one on purpose: GitHub flags workflows that serialise every
          # secret at once as possibly malicious and refuses to run them.
          # Using another name in config.yaml (e.g. api_key_env: MY_KEY)? Add a line here too.
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:              ${{ secrets.SMTP_HOST }}
          SMTP_PORT:              ${{ secrets.SMTP_PORT }}
          SMTP_USER:              ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:          ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:               ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK_URL:    ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC:             ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN:             ${{ secrets.NTFY_TOKEN }}
          APPRISE_URLS:           ${{ secrets.APPRISE_URLS }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY:         ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY:        ${{ secrets.MISTRAL_API_KEY }}
          IMAP_HOST:              ${{ secrets.IMAP_HOST }}
          IMAP_USER:              ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD:          ${{ secrets.IMAP_PASSWORD }}
          INFOJOBS_CLIENT_ID:     ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          ADZUNA_APP_ID:          ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:         ${{ secrets.ADZUNA_APP_KEY }}
          MODE: ${{ inputs.mode || 'run' }}
          ONLY_GROUPS: ${{ inputs.groups }}
          FORCE: ${{ inputs.force }}
          SOURCE: ${{ inputs.source }}
        run: |
          args=(--data-dir data)
          [ -n "$ONLY_GROUPS" ] && args+=(--groups "$ONLY_GROUPS")
          case "$MODE" in
            run)
              [ "$FORCE" = "true" ] && args+=(--force)
              uv run --no-sync jobfinder run --skip-polling "${args[@]}" ;;
            dry-run)     uv run --no-sync jobfinder dry-run "${args[@]}" ;;
            bootstrap)   uv run --no-sync jobfinder bootstrap "${args[@]}" ;;
            test-notify) uv run --no-sync jobfinder test-notify --data-dir data ;;
            test-ai)     uv run --no-sync jobfinder test-ai --data-dir data ;;
            test-source) uv run --no-sync jobfinder test-source --data-dir data "$SOURCE" ;;
            validate)    uv run --no-sync jobfinder validate-config --data-dir data ;;
            tracker-sync) uv run --no-sync jobfinder tracker-sync --data-dir data ;;
            *) echo "::error::unknown mode"; exit 1 ;;
          esac

  # Public repos disable scheduled workflows after 60 days without activity.
  # State commits go to the private repo, so re-enable the workflows every week.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 18 * * 0'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in jobfinder.yml favorites.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
