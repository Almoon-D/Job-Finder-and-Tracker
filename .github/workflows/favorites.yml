# Favourite companies: near real-time alerts.
# Trigger it every 10 minutes from an external scheduler (cron-job.org → workflow_dispatch),
# because GitHub's own cron can be hours late. The cron below is only a fallback.
#
# No external scheduler? Set the repository variable FAVORITES_LOOP=true: one run then stays alive for
# about 5.5 h, polling every 10 minutes, and starts its own successor before it ends (the */30 cron below
# restarts the chain if it ever breaks). Unset the variable to stop it. See docs/SETUP.es.md §8.
name: favorites

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write   # only used by the FAVORITES_LOOP mode, to start the next run with `gh workflow run`

concurrency:
  group: jobfinder-favorites
  cancel-in-progress: false

jobs:
  run:
    if: vars.DATA_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ vars.FAVORITES_LOOP == 'true' && 350 || 10 }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout private data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --no-dev --extra apprise

      - name: Browser needed?
        id: browser
        run: uv run --no-sync jobfinder needs-browser --data-dir data --groups favorites

      - name: Install headless browser
        if: steps.browser.outputs.browser == 'true'
        run: |
          uv sync --frozen --no-dev --extra apprise --extra browser
          uv run --no-sync playwright install --with-deps chromium

      - name: Run favourites
        env:
          # Secrets are listed one by one on purpose: GitHub flags workflows that serialise every
          # secret at once as possibly malicious and refuses to run them.
          # Using another name in config.yaml (e.g. api_key_env: MY_KEY)? Add a line here too.
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:              ${{ secrets.SMTP_HOST }}
          SMTP_PORT:              ${{ secrets.SMTP_PORT }}
          SMTP_USER:              ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:          ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:               ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK_URL:    ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN:      ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID:     ${{ secrets.DISCORD_CHANNEL_ID }}
          NTFY_TOPIC:             ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN:             ${{ secrets.NTFY_TOKEN }}
          APPRISE_URLS:           ${{ secrets.APPRISE_URLS }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY:         ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY:        ${{ secrets.MISTRAL_API_KEY }}
          IMAP_HOST:              ${{ secrets.IMAP_HOST }}
          IMAP_USER:              ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD:          ${{ secrets.IMAP_PASSWORD }}
          INFOJOBS_CLIENT_ID:     ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          ADZUNA_APP_ID:          ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:         ${{ secrets.ADZUNA_APP_KEY }}
          LOOP: ${{ vars.FAVORITES_LOOP }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LOOP" != "true" ]; then
            uv run --no-sync jobfinder run --data-dir data --groups favorites
            exit
          fi
          # Loop mode: poll every 10 minutes for 5 h 30 min, then hand over to a fresh run.
          end=$(( $(date +%s) + 19800 ))
          while :; do
            # Other workflows push state to the data repo meanwhile: start every poll from its latest version,
            # or a stale copy would send alerts twice. A commit that could not be pushed is rebased, never dropped.
            git -C data fetch -q origin || echo "::warning::could not refresh the data repository"
            if [ -n "$(git -C data log '@{u}..HEAD' --oneline)" ]; then
              git -C data pull -q --rebase -X theirs && git -C data push -q || echo "::warning::could not push pending state"
            else
              git -C data reset -q --hard '@{u}'
            fi
            uv run --no-sync jobfinder run --data-dir data --groups favorites || echo "::warning::a favourites poll failed"
            now=$(date +%s)
            [ $(( now + 600 )) -ge "$end" ] && break
            sleep $(( 600 - now % 600 ))
          done
          gh workflow run favorites.yml --ref "$GITHUB_REF_NAME" \
            || echo "::warning::could not start the next run; the */30 cron will"
