# Favourite companies: near real-time alerts.
# Trigger it every 10 minutes from an external scheduler (cron-job.org → workflow_dispatch),
# because GitHub's own cron can be hours late. The cron below is only a fallback.
name: favorites

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: jobfinder-favorites
  cancel-in-progress: false

jobs:
  run:
    if: vars.DATA_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Checkout private data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --no-dev --extra apprise

      - name: Browser needed?
        id: browser
        run: uv run --no-sync jobfinder needs-browser --data-dir data --groups favorites

      - name: Install headless browser
        if: steps.browser.outputs.browser == 'true'
        run: |
          uv sync --frozen --no-dev --extra apprise --extra browser
          uv run --no-sync playwright install --with-deps chromium

      - name: Run favourites
        env:
          # Secrets are listed one by one on purpose: GitHub flags workflows that serialise every
          # secret at once as possibly malicious and refuses to run them.
          # Using another name in config.yaml (e.g. api_key_env: MY_KEY)? Add a line here too.
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:              ${{ secrets.SMTP_HOST }}
          SMTP_PORT:              ${{ secrets.SMTP_PORT }}
          SMTP_USER:              ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:          ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:               ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK_URL:    ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN:      ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID:     ${{ secrets.DISCORD_CHANNEL_ID }}
          NTFY_TOPIC:             ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN:             ${{ secrets.NTFY_TOKEN }}
          APPRISE_URLS:           ${{ secrets.APPRISE_URLS }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY:         ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY:        ${{ secrets.MISTRAL_API_KEY }}
          IMAP_HOST:              ${{ secrets.IMAP_HOST }}
          IMAP_USER:              ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD:          ${{ secrets.IMAP_PASSWORD }}
          INFOJOBS_CLIENT_ID:     ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          ADZUNA_APP_ID:          ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:         ${{ secrets.ADZUNA_APP_KEY }}
        run: uv run --no-sync jobfinder run --data-dir data --groups favorites
