# ─────────────────────────────────────────────────────────────────────────────
#  Example configuration. Copy it to YOUR PRIVATE data repository as config.yaml
#  and edit it there. Never commit your real config to the public repository.
#  All companies below are fictional placeholders.
# ─────────────────────────────────────────────────────────────────────────────
version: 1
timezone: Europe/Berlin          # IANA name; schedules below use this local time
language: en                     # notifications language: en | es

# Anonymous description used by the (optional) AI matcher. No names or contact data.
profile: |
  6 years of experience as a data analyst in e-commerce; recently certified Scrum product owner.
  Looking for product management roles in B2B software.

# What you are looking for. The AI uses names/descriptions; keywords are the
# filter when the AI is disabled or unavailable.
role_families:
  - name: product
    description: Product manager / product owner roles (not project management or sales).
    include_any: [product manager, product owner, produktmanager, gestor de producto, chef de produit]
  - name: analytics
    description: Senior data / product analytics roles.
    include_any: [data analyst, product analyst, analytics lead]

filters:
  exclude_title_any: [sales, recruiter, engineer, developer, intern*, internship, trainee, working student]
  exclude_text_any: []
  require_keyword_match: null    # null = only when the AI is off

experience:
  min_years: 4
  max_years: 8
  hard: false

# Countries (ISO code or name) and/or cities. Add as many as you like.
locations:
  - {country: DE}
  - {city: Lisbon, country: PT}
  - {city: Toronto, country: CA, aliases: [GTA]}

# Jobs based elsewhere that mention your market ("DACH market, based in London").
coverage:
  enabled: true
  text_any: [DACH, German-speaking market]
  search_terms: [DACH]
  only_cities: []

groups:
  favorites:                     # near real-time alerts (external trigger every 10 min)
    interval_minutes: 10
    quiet_hours: "23:00-07:00"
    format: per_job
    priority: high
    notify_empty: false
  company_sites:                 # company career sites, twice a day
    times: ["09:00", "20:30"]
    max_age_days: 3
    format: per_job
    # grace_hours: 12            # a slot GitHub skipped still runs up to this many hours late (default 12)
  boards:                        # job boards, every 3 days
    times: ["11:00"]
    every_days: 3
    max_age_days: 3.5
    format: grouped              # digest grouped by role family and location
    max_items: 30                # the rest goes to the feed
  recruiters:                    # recruiters / headhunters, every 3 days
    times: ["11:00"]
    every_days: 3
    max_age_days: 3.5
  weekly_summary:                # weekly report to every channel + reports/weekly/YYYY-Www.md
    kind: summary
    times: ["18:00"]
    weekdays: [sun]

sources:
  # Paste a careers URL: the adapter is detected automatically for Workday,
  # Oracle HCM, Eightfold, Greenhouse, Lever, SmartRecruiters, Ashby, Workable,
  # Recruitee, Teamtailor, Personio and SuccessFactors (legacy portal).
  - name: Example Software
    url: https://examplesoftware.wd3.myworkdayjobs.com/External
    favorite: true
  - name: Example Marketplace
    url: https://boards.greenhouse.io/examplemarketplace

  # Any other site: declarative recipes (see docs/SOURCES.md)
  - name: Example Startup (custom JSON API)
    type: json_api
    url: https://careers.example-startup.test/api/jobs?page={page}&q={query}
    items: "results"
    fields: {id: id, title: title, url: url, location: city, posted_at: published}
    pagination: {type: page, start: 1, limit: 20, max_pages: 3}
  - name: Example Studio
    type: page_monitor
    url: https://example-studio.test/careers
    link_pattern: "/careers/.+"

  # LinkedIn public search (no login). Keep queries few (combine with OR); never in 'favorites'.
  - name: LinkedIn
    group: boards
    type: linkedin
    queries: ['"product manager" OR "product owner"']
    max_pages: 2

  # Other boards (see docs/SOURCES.md): efinancialcareers, jobcloud (jobup.ch / jobs.ch),
  # infojobs and adzuna (skipped until their API keys exist).
  - name: Adzuna
    group: boards
    type: adzuna
    queries: [product manager]

  # Job-alert e-mails sent to a dedicated mailbox, read-only (IMAP_USER / IMAP_PASSWORD).
  - name: Alert e-mails
    group: boards
    type: email_alerts
    parsers: [linkedin, indeed]
    unknown: ignore              # or "ai"

  # Recruiter with schema.org JobPosting pages listed in its sitemap
  - name: Example Recruiter
    group: recruiters
    type: jsonld_sitemap
    url: https://recruiter.example.test/sitemap.xml
    url_pattern: "/jobs/"
  # Recruiter with HTML listings: a sector page plus keyword searches (a 404 = no results)
  - name: Example Search Firm
    group: recruiters
    type: html_list
    urls:
      - "https://search-firm.example.test/jobs/finance?sort=newest&page={page}"
      - "https://search-firm.example.test/jobs/{query_slug}?sort=newest&page={page}"
    queries: [product manager]
    item: li.job
    title: h3 a
    link: h3 a
    location: .job-location
    pagination: {start: 0, max_pages: 2}
    delay_seconds: 1             # robots.txt Crawl-delay
    detail: {jsonld: true}       # description and date from the job page's JobPosting JSON-LD

llm:
  enabled: true                  # without an API key it silently falls back to keywords
  min_score: 60
  batch_size: 15
  max_provider_failures: 2       # a provider failing this many requests in a row is skipped for the rest of the run
  max_seconds_per_run: 600       # AI time budget per run; after it, the remaining jobs use keyword rules
  providers:                     # any OpenAI-compatible API, tried in order (a 429 moves on at once)
    - name: gemini-flash
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-3.8-flash
      api_key_env: GEMINI_API_KEY
    - name: nvidia
      base_url: https://integrate.api.nvidia.com/v1
      model: deepseek-ai/deepseek-v4.1-flash
      api_key_env: NVIDIA_API_KEY
    - name: gemini-lite
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-3.5-flash-lite
      api_key_env: GEMINI_API_KEY
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY

notify:                          # credentials always come from GitHub Secrets
  telegram: {enabled: true}
  discord: {enabled: false}
  email: {enabled: false}
  ntfy: {enabled: false}
  apprise: {enabled: false}

# Tracker: ⭐/✅/🗣/❌ buttons on per-job Telegram messages, saved in tracker/applications.csv
# of the private repo (editable by hand). Commands: /status and /pending (or /estado, /pendientes).
tracker:
  enabled: true                  # only with notify.telegram
  follow_up_days: 14             # /pending also lists applications without news for this long

feeds:                           # feeds/*.json and jobs.xml for dashboards (docs/DASHBOARDS.md)
  enabled: true
