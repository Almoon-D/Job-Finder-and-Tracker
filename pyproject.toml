[project]
name = "jobfinder"
version = "0.1.0"
description = "Self-hosted job finder that runs on GitHub Actions: watches company career sites, job boards and recruiters, filters by your private preferences and notifies you."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jmespath>=1.0",
    "selectolax>=0.3.21",
    "dateparser>=1.2",
    "geonamescache>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
apprise = ["apprise>=1.8"]
browser = ["playwright>=1.45"]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
